[package]
name = "xrt-vision"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

# xeno-rt's vision-task crate. Hosts ONNX model inference for image-domain
# tasks (background removal first, upscale / denoise / face-restore /
# inpaint / depth / colorize next), behind a single Rust API that
# `xrt-server` re-exposes as `/v1/images/...` HTTP routes.
#
# Implementation strategy: this crate currently delegates to the
# `xeno-lib::ai_staging::background_removal` module that the xeno-lib team
# pre-staged for migration (see `xeno-lib/docs/AI_MIGRATION.md`). Once the
# migration completes, the staged module will move physically into this
# crate and the xeno-lib path-dependency will be removed. Behaviour is
# identical either way; only the source location changes.

[features]
default = []
cuda = []

[dependencies]
# Inference primitives. We pin exactly what xeno-lib uses so the model
# binary loaded at runtime is bit-identical regardless of which crate
# instantiates the session.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
ndarray = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Bring xeno-lib's already-extracted background-removal module in via path
# dependency. xeno-lib lives as a sibling repo to xeno-rt by convention
# (`xeno-corporation/xeno-lib`). Falls back to a clear cargo error if the
# directory is missing.
xeno-lib = { path = "../../../xeno-lib", features = ["background-removal"] }

thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
once_cell = "1"

[dev-dependencies]
tokio.workspace = true
