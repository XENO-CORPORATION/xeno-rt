[package]
name = "xrt-server"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
cuda = ["xrt-runtime/cuda", "xrt-vision/cuda", "xrt-image?/cuda", "xrt-audio/cuda"]
image-generation = ["dep:xrt-image"]
transcription = []

[dependencies]
axum = { workspace = true, features = ["multipart"] }
base64 = "0.22"
clap.workspace = true
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
fs2 = "0.4"
xrt-audio = { path = "../xrt-audio" }
xrt-hub = { path = "../xrt-hub" }
xrt-image = { path = "../xrt-image", optional = true }
xrt-openai = { path = "../xrt-openai" }
xrt-runtime = { path = "../xrt-runtime" }
xrt-cuda = { path = "../xrt-cuda" }
xrt-tokenizer = { path = "../xrt-tokenizer" }
xrt-vision = { path = "../xrt-vision" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
xrt-image = { path = "../xrt-image", features = ["test-util"] }
