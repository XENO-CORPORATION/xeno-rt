[package]
name = "xrt-runtime"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
cuda = ["xrt-cuda/cuda", "xrt-models/cuda"]
moe-route-trace = ["xrt-models/moe-route-trace"]
moe-router-exact-reference = ["xrt-models/moe-router-exact-reference"]

[dependencies]
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tokio.workspace = true
tracing.workspace = true
xrt-core = { path = "../xrt-core" }
xrt-cuda = { path = "../xrt-cuda" }
xrt-gguf = { path = "../xrt-gguf" }
xrt-kernels = { path = "../xrt-kernels" }
xrt-models = { path = "../xrt-models" }
xrt-safetensors = { path = "../xrt-safetensors" }
xrt-tokenizer = { path = "../xrt-tokenizer" }

[dev-dependencies]
safetensors.workspace = true
tempfile = "3"
