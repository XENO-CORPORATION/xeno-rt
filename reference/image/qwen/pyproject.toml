[project]
name = "xrt-qwen-image-reference"
version = "0.1.0"
description = "Pinned non-production Qwen Image reference and benchmark harness"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate==1.14.0",
    "diffusers==0.39.0",
    "ftfy==6.3.1",
    "huggingface-hub==1.24.0",
    "numpy==2.3.5",
    "openai==2.46.0",
    "pillow==12.3.0",
    "protobuf==7.35.1",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
    "torch==2.13.0+cu130",
    "torchvision==0.28.0+cu130",
    "transformers==5.14.1",
]

[project.optional-dependencies]
quality = [
    "open-clip-torch==3.3.0",
    "paddleocr[doc-parser]==3.7.0",
    "paddlepaddle-gpu==3.3.0; sys_platform == 'win32'",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
]
quality-cpu = [
    "open-clip-torch==3.3.0",
    "paddleocr[doc-parser]==3.7.0",
    "paddlepaddle==3.3.0",
    "scikit-image==0.26.0",
    "scipy==1.17.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "paddle-cu130"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
paddlepaddle-gpu = { index = "paddle-cu130" }
paddlepaddle = { index = "paddle-cpu" }
