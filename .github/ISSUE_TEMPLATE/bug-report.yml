name: Bug Report
description: Report a reproducible defect in a supported xeno-rt path.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use private vulnerability reporting from SECURITY.md.
        Remove API keys, private prompts, model weights, and personal data from logs.
  - type: textarea
    id: description
    attributes:
      label: Description and impact
      description: What failed, and what user/workload is blocked?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.0-rc.1 or 42e54be (include dirty-tree state)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include exact command/request and relevant XRT variables with secrets removed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux x86_64
        - Windows x86_64
        - Linux aarch64 (best effort)
        - macOS Apple Silicon (best effort)
        - macOS Intel (best effort)
        - Other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Requested and active backend
      options:
        - CPU
        - CUDA
        - Auto selected CPU
        - Auto selected CUDA
        - External OpenAI-compatible
        - Unknown / load failed
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware and toolchain
      description: CPU, RAM, GPU/VRAM/driver if applicable, and rustc version.
      placeholder: Ryzen 9, 64 GiB RAM, RTX 4090 24 GiB, driver ..., rustc ...
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model source and format
      description: Public identifier/path shape, architecture, GGUF/SafeTensors, quantization, and size.
      placeholder: Qwen3 0.6B, GGUF Q4_K_M, 450 MiB
    validations:
      required: true
  - type: input
    id: runtime-policy
    attributes:
      label: Cache, tokens, and concurrency
      placeholder: q8 KV, 128 prompt, 32 output, concurrency 1
  - type: textarea
    id: resources
    attributes:
      label: Memory and runtime status
      description: For crashes/OOM, include RAM/VRAM before and peak plus /v1/runtime/status when available.
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Last known good version, hosted run, benchmark JSON, or related issue.
