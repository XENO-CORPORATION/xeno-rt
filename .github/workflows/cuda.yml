name: CUDA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-runner-check:
    name: GPU Runner Check
    runs-on: [self-hosted, Windows, X64, cuda, gpu]
    timeout-minutes: 5
    steps:
      - name: Show GPU
        shell: pwsh
        run: nvidia-smi
      - name: Show Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version
