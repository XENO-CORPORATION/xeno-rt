name: CUDA

on:
  workflow_dispatch:
    inputs:
      run_gpu_parity:
        description: "Run serial synthetic CUDA parity tests"
        required: true
        default: true
        type: boolean
      run_real_model_parity:
        description: "Compare the real Q4_K model CPU/CUDA top token"
        required: true
        default: false
        type: boolean
      run_real_model_smoke:
        description: "Run a bounded real-model CUDA smoke"
        required: true
        default: false
        type: boolean
      model:
        description: "Model alias/path available on the GPU runner"
        required: true
        default: "vibethinker-3b-q4"
        type: string
      real_model_path:
        description: "Absolute GGUF path for CPU/CUDA parity"
        required: true
        default: 'X:\ai\models\llm\VibeThinker-3B-GGUF\VibeThinker-3B.Q4_K_M.gguf'
        type: string
      cache_mode:
        description: "CUDA KV cache mode for the real-model smoke"
        required: true
        default: "agent_adaptive"
        type: choice
        options:
          - f32
          - q8
          - kq4_vq8
          - agent_adaptive
      max_tokens:
        description: "Real-model smoke decode token count"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: cuda-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  CARGO_TARGET_DIR: '${{ github.workspace }}\..\.cargo-target\cuda'
  RUST_TEST_THREADS: "1"
  XENO_LIB_CI_COMMIT: "8826b3940342d4b5850cf332378a72c02fbd1073"
  XENO_LIB_SOURCE: 'X:\code\xeno-corporation\xeno-lib'

jobs:
  cuda-validation:
    name: CUDA Validation
    # Keep this manual: a self-hosted runner must never execute untrusted PR code.
    runs-on: [self-hosted, Windows, X64, cuda, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Show GPU
        shell: powershell
        run: nvidia-smi
      - name: Show Rust toolchain
        shell: powershell
        run: |
          rustc --version
          cargo --version
      - name: Prepare pinned xeno-lib sibling
        shell: powershell
        run: |
          $runnerWorkspace = [IO.Path]::GetFullPath($env:RUNNER_WORKSPACE)
          $destination = [IO.Path]::GetFullPath(
            (Join-Path $runnerWorkspace "xeno-lib")
          )
          if (-not $destination.StartsWith(
            $runnerWorkspace + [IO.Path]::DirectorySeparatorChar
          )) {
            throw "unsafe xeno-lib destination: $destination"
          }
          if (-not (Test-Path -LiteralPath $env:XENO_LIB_SOURCE -PathType Container)) {
            throw "missing pinned xeno-lib source repo: $env:XENO_LIB_SOURCE"
          }
          & git -C $env:XENO_LIB_SOURCE cat-file -e "$env:XENO_LIB_CI_COMMIT^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "xeno-lib commit is unavailable: $env:XENO_LIB_CI_COMMIT"
          }
          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "xeno-lib-ci.zip"
          if (Test-Path -LiteralPath $archive) {
            Remove-Item -LiteralPath $archive -Force
          }
          & git -C $env:XENO_LIB_SOURCE archive `
            --format=zip `
            --output=$archive `
            $env:XENO_LIB_CI_COMMIT
          if ($LASTEXITCODE -ne 0) {
            throw "failed to archive pinned xeno-lib commit"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Remove-Item -LiteralPath $archive -Force
      - name: Run serial CUDA compile and parity gate
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $arguments = @{ TimeoutSeconds = 300 }
          if ('${{ inputs.run_gpu_parity }}' -eq 'true') {
            $arguments.RunGpuParity = $true
          }
          if ('${{ inputs.run_real_model_parity }}' -eq 'true') {
            $arguments.RealModelPath = '${{ inputs.real_model_path }}'
          }
          & .\scripts\safe-cuda-check.ps1 @arguments *>&1 |
            Tee-Object -FilePath artifacts\cuda-validation.log
      - name: Run bounded real-model CUDA smoke
        if: ${{ inputs.run_real_model_smoke }}
        shell: powershell
        run: |
          & .\scripts\safe-cuda-smoke.ps1 `
            -ConfirmGpuRun `
            -CompareCpu `
            -Model '${{ inputs.model }}' `
            -CacheMode '${{ inputs.cache_mode }}' `
            -MaxTokens ${{ inputs.max_tokens }} `
            -Repetitions 2 `
            -BuildTimeoutSeconds 600 `
            -RunTimeoutSeconds 240 *>&1 |
              Tee-Object -FilePath artifacts\cuda-smoke.log
      - name: Upload CUDA logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cuda-validation-${{ github.run_id }}
          path: artifacts\*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Clean pinned xeno-lib sibling
        if: ${{ always() }}
        shell: powershell
        run: |
          $runnerWorkspace = [IO.Path]::GetFullPath($env:RUNNER_WORKSPACE)
          $destination = [IO.Path]::GetFullPath(
            (Join-Path $runnerWorkspace "xeno-lib")
          )
          if (-not $destination.StartsWith(
            $runnerWorkspace + [IO.Path]::DirectorySeparatorChar
          )) {
            throw "unsafe xeno-lib cleanup destination: $destination"
          }
          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
