name: CUDA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-runner-check:
    name: GPU Runner Check
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Show GPU
        shell: powershell
        run: nvidia-smi
      - name: Show Rust toolchain
        shell: powershell
        run: |
          rustc --version
          cargo --version
